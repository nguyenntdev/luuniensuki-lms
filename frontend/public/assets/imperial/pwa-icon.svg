<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient: Warm Deep Lacquer / Gold border -->
    <linearGradient id="pwaBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a231d" />
      <stop offset="100%" stop-color="#14110e" />
    </linearGradient>
    
    <linearGradient id="imperialGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f" />
      <stop offset="40%" stop-color="#C68A2C" />
      <stop offset="100%" stop-color="#8a5c12" />
    </linearGradient>

    <linearGradient id="roofTile" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d49a37" />
      <stop offset="50%" stop-color="#ffe082" />
      <stop offset="100%" stop-color="#b27918" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C68A2C" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Circle for PWA Icon -->
  <rect width="512" height="512" rx="104" fill="url(#pwaBg)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#imperialGold)" stroke-width="8" opacity="0.8" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="#F7F2E8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.3" />

  <!-- Ngo Mon / Pavilion Iconography (Lầu Ngũ Phụng - Cố đô Huế) -->
  <g transform="translate(0, 10)" filter="url(#goldGlow)">
    <!-- Fortress Stone Base (Đài chữ U) -->
    <path d="M 120 370 L 392 370 L 392 300 L 340 300 L 340 320 L 172 320 L 172 300 L 120 300 Z" 
          fill="#4a3c2c" stroke="url(#imperialGold)" stroke-width="4" />
    
    <!-- Archway Gate Openings (Cửa Ngọ Môn) -->
    <!-- Middle Emperor Gate -->
    <path d="M 236 370 L 236 335 Q 256 325 276 335 L 276 370 Z" fill="#14110e" stroke="url(#imperialGold)" stroke-width="2" />
    <!-- Left / Right Side Gates -->
    <path d="M 194 370 L 194 344 Q 206 338 218 344 L 218 370 Z" fill="#14110e" opacity="0.8" />
    <path d="M 294 370 L 294 344 Q 306 338 318 344 L 318 370 Z" fill="#14110e" opacity="0.8" />

    <!-- Wooden Columns Layer -->
    <line x1="160" y1="300" x2="160" y2="245" stroke="#C68A2C" stroke-width="7" stroke-linecap="round" />
    <line x1="208" y1="300" x2="208" y2="245" stroke="#C68A2C" stroke-width="7" stroke-linecap="round" />
    <line x1="256" y1="300" x2="256" y2="245" stroke="#C68A2C" stroke-width="8" stroke-linecap="round" />
    <line x1="304" y1="300" x2="304" y2="245" stroke="#C68A2C" stroke-width="7" stroke-linecap="round" />
    <line x1="352" y1="300" x2="352" y2="245" stroke="#C68A2C" stroke-width="7" stroke-linecap="round" />

    <!-- First Roof (Mái dưới Lầu Ngũ Phụng) -->
    <path d="M 124 250 Q 150 254 256 250 Q 362 254 388 250 L 372 230 Q 256 235 140 230 Z" 
          fill="url(#roofTile)" stroke="url(#imperialGold)" stroke-width="3" />
    <!-- Swooping Eaves left and right -->
    <path d="M 124 250 Q 110 240 106 226" fill="none" stroke="url(#imperialGold)" stroke-width="4" stroke-linecap="round" />
    <path d="M 388 250 Q 402 240 406 226" fill="none" stroke="url(#imperialGold)" stroke-width="4" stroke-linecap="round" />

    <!-- Upper Columns -->
    <line x1="190" y1="230" x2="190" y2="185" stroke="#C68A2C" stroke-width="6" stroke-linecap="round" />
    <line x1="256" y1="230" x2="256" y2="185" stroke="#C68A2C" stroke-width="7" stroke-linecap="round" />
    <line x1="322" y1="230" x2="322" y2="185" stroke="#C68A2C" stroke-width="6" stroke-linecap="round" />

    <!-- Upper Main Roof (Mái trên Lầu Ngũ Phụng) -->
    <path d="M 158 190 Q 200 194 256 190 Q 312 194 354 190 L 338 165 Q 256 172 174 165 Z" 
          fill="url(#roofTile)" stroke="url(#imperialGold)" stroke-width="3" />
    <!-- Upper swooping eaves -->
    <path d="M 158 190 Q 146 178 142 162" fill="none" stroke="url(#imperialGold)" stroke-width="4" stroke-linecap="round" />
    <path d="M 354 190 Q 366 178 370 162" fill="none" stroke="url(#imperialGold)" stroke-width="4" stroke-linecap="round" />

    <!-- Central Ridge Ornament (Thái Cực / Bình Hồ Lô Hoàng Gia) -->
    <path d="M 252 165 L 260 165 L 258 142 Q 266 138 256 126 Q 246 138 254 142 Z" 
          fill="url(#imperialGold)" stroke="#ffd54f" stroke-width="1.5" />
  </g>

  <!-- Modern Digital / Heritage Stylized Badge at Bottom -->
  <text x="256" y="442" text-anchor="middle" font-family="'Times New Roman', serif" font-weight="bold" font-size="28" fill="#F7F2E8" letter-spacing="4">
    ĐẠI NỘI HUẾ
  </text>
  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="14" fill="#C68A2C" letter-spacing="3">
    BẢN ĐỒ HỌC TẬP SỐ
  </text>
</svg>
