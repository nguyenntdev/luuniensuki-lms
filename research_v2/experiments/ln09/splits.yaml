# LN-09 split policy. Grouped holdout: every case shares its group_id template
# family; no group appears in both dev and test.
split_policy: grouped_holdout
split_id_for_matrix: test
group_key: group_id
splits:
  dev:
    description: >
      Reserved for threshold calibration (EMA threshold, staleness window)
      and error analysis during development. The frozen T3 materialization in
      research_v2/data/ln09 is a pure holdout; dev rows were used only to
      design the preregistered rule oracle before freezing.
    case_id_prefix: "LN-09-DEV-"
  test:
    description: >
      Frozen holdout: 120 cases, 6 balanced decision families x 20
      (propose_explained_action, abstain_missing_evidence, abstain_conflict,
      abstain_unverified_source, request_refresh, descriptive_summary_only
      coverage via the counterexample grid), generated by the preregistered
      T3 stress generator with per-case procedural seeds recorded in the
      dataset. Stress dimensions: contradictory signals, missing logs, stale
      mastery, source mismatch, cohort suppression, teacher override.
    case_id_prefix: "LN-09-HOLD-"
    n_cases: 120
leakage_controls:
  - "group_id never crosses split boundaries"
  - "gold sealed until predictions exported"
  - "input_sha256 recorded per prediction row for pairing audits"
  - "teacher_override status is inference-time input, never oracle material"
