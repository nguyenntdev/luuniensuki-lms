# LN-01 preregistration — Spiral Curriculum Sequence Synthesis and Constraint-Aware Path Planning
study_id: LN-01
title: "Spiral curriculum sequence synthesis: constraint-aware path planning vs baselines"
status: PLANNED_NOT_EXECUTED_BY_PREREG
primary_metric: spiral_validity_rate
secondary_metrics:
  - false_accept_rate
  - false_reject_rate
decision_space: [accept, reject_cycle, reject_grade_order, reject_missing_anchor, reject_no_progression]
label_space_divergence: >
  The shared contract label space research_v2.contracts.label_space.LN01_DECISIONS
  uses the path-planning framing (find_valid_route / no_feasible_route). The frozen
  T3 gold for LN-01 uses the legacy engine's decision vocabulary. Predictions are
  emitted in the gold-compatible vocabulary so the sealed evaluator can score them
  verbatim; this divergence is documented, not silently absorbed.
hypotheses:
  H1: >
    The proposed constraint-aware planner (redundancy-aware cycle analysis +
    grade gating + anchor verification + Bloom depth gate) achieves higher
    spiral validity rate than C0 (naive linear) and C1 (topological sort
    without Bloom gating) on the frozen T3 holdout.
  H2: >
    The proposed planner commits zero false infeasibility on the mandatory
    alternative-provider counterexample family (two providers of the same
    outcome must not be rejected as infeasible).
  H3: >
    Every ablation (a1 no_cycle_check, a2 no_crosswalk, a3 no_depth_gate) is
    strictly worse than the proposed method on at least one error family that
    the removed mechanism is responsible for.
comparators:
  - id: baselines_b0
    role: SANITY_ONLY
    comparability: REIMPLEMENTATION
    note: "Flat sequencing; must never be reported as a strong baseline."
  - id: baselines_c1
    role: MATCHED_CLASSICAL
    comparability: REIMPLEMENTATION
    note: "Kahn topological sort with grade gating; no Bloom depth gate, no anchor check."
  - id: ablations_a1
    role: ABLATION
    comparability: CONFIG_FLAG_OF_PROPOSED
    note: "Removes cycle feasibility check."
  - id: ablations_a2
    role: ABLATION
    comparability: CONFIG_FLAG_OF_PROPOSED
    note: "Removes curriculum-anchor (crosswalk) verification."
  - id: ablations_a3
    role: ABLATION
    comparability: CONFIG_FLAG_OF_PROPOSED
    note: "Removes Bloom cognitive-depth gating."
stats:
  ci_method: wilson_95_primary_clopper_pearson_95_sensitivity
  paired_test: mcnemar_exact
  multiple_comparisons: holm
  grouping_unit: "learning objective family + motif/source family + graph template"
  min_evidence_n: 5
falsification:
  - "An always-accept and an always-reject control must never both score perfectly."
  - "If primary metric is not computable (missing paired cases), gate = EVIDENCE_INSUFFICIENT."
oracle_protocol: evaluator_only_after_prediction_export
