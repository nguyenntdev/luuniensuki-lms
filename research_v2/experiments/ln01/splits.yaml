# LN-01 split policy. Grouped holdout: every case shares its group_id template
# family; no group appears in both dev and test.
split_policy: grouped_holdout
split_id_for_matrix: test
group_key: group_id
splits:
  dev:
    description: >
      Reserved for threshold calibration and error analysis during development.
      The frozen T3 materialization in research_v2/data/ln01 is a pure holdout;
      dev rows were used only to design the preregistered rule oracle before freezing.
    case_id_prefix: "LN-01-DEV-"
  test:
    description: >
      Frozen holdout: 120 cases, 5 balanced decision families x 24
      (accept, reject_cycle, reject_grade_order, reject_missing_anchor,
      reject_no_progression), generated by the preregistered T3 stress
      generator with per-case procedural seeds recorded in the dataset.
    case_id_prefix: "LN-01-HOLD-"
    n_cases: 120
leakage_controls:
  - "group_id never crosses split boundaries"
  - "gold sealed until predictions exported"
  - "input_sha256 recorded per prediction row for pairing audits"
