services:
  api:
    ports:
      - "127.0.0.1:8000:8000"
  api_rust:
    ports:
      - "127.0.0.1:8001:8001"
  web:
    ports:
      - "127.0.0.1:3000:3000"
  nginx:
    ports: !override
      - "8088:80"
      - "8443:443"
    volumes: !override
      - ./nginx-lms.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./ban-duc-noi:/var/www/assets/ban-duc-noi:ro
