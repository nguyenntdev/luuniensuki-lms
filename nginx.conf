  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml;
  gzip_disable "msie6";

  proxy_ssl_server_name on;
  proxy_ssl_name lms.histolab.icu;

  # Proxy everything to the new LMS stack (served on 8444).
  location / {
    proxy_pass https://lms_https_upstream;
  }
}
