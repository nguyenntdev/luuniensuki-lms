upstream api_upstream {
  server api:8000;
  keepalive 32;
}

upstream web_upstream {
  server web:3000;
  keepalive 32;
}

upstream lms_https_upstream {
  server 172.20.0.1:8444;
  keepalive 8;
}

server {
  listen 80;
  server_name learn.histolab.icu;

  # ACME challenge (Certbot webroot mode)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 80;
  server_name lms.histolab.icu;

  # ACME challenge (Certbot webroot mode)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name learn.histolab.icu;

  # Certbot-managed cert paths (stub; created after first issuance)
  ssl_certificate     /etc/letsencrypt/live/lms.histolab.icu/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/lms.histolab.icu/privkey.pem;

  # Reasonable TLS defaults (you can replace with certbot's generated includes)
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # Security headers
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://sketchfab.com https://*.sketchfab.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://store.histolab.icu https://*.sketchfab.com https://images.unsplash.com https://*.wikimedia.org https://tile.openstreetmap.org https://*.tile.openstreetmap.org; frame-src 'self' https://sketchfab.com https://*.sketchfab.com; connect-src 'self' wss: https:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'self';" always;

  client_max_body_size 50m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Correlation and Request ID propagation for end-to-end tracing
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header X-Correlation-ID $request_id;
  add_header X-Request-ID $request_id always;
  add_header X-Correlation-ID $request_id always;
  # Avoid 504s on long-running upstream responses.
  proxy_connect_timeout 10s;
  proxy_send_timeout 180s;
  proxy_read_timeout 180s;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml;
  gzip_disable "msie6";

  # Backend routes
  location ^~ /api/ {
    proxy_pass http://api_upstream;
  }

  # Health check endpoint
  location = /health {
    proxy_pass http://api_upstream;
  }

  # 3D models are hosted on store.histolab.icu (no CORS headers), so proxy them as same-origin assets.
  location ^~ /assets/models/ {
    proxy_ssl_server_name on;
    proxy_ssl_name store.histolab.icu;
    proxy_set_header Host store.histolab.icu;
    proxy_buffering off;
    proxy_pass https://store.histolab.icu/;

    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # Static assets (images/models). Served directly by Nginx.
  location ^~ /assets/ {
    root /var/www;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # Current backend also exposes these at root (not under /api)
  location ^~ /motifs/ {
    proxy_pass http://api_upstream;
  }

  location ^~ /progress/ {
    proxy_pass http://api_upstream;
  }

  # Frontend (Next.js)
  location / {
    # We don't use Next.js Server Actions; reject non-GET to reduce noise/attack surface.
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
      return 405;
    }
    proxy_pass http://web_upstream;
  }
}

