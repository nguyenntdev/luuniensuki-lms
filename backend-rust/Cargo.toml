[package]
name = "luuniensuki-api"
version = "0.1.0"
edition = "2021"

# All direct dependencies are pinned to exact versions for the duration of
# the strangler-fig migration (Requirement 11.4). When a dep is added or
# bumped, record the resulting peak release-build RSS in
# `backend-rust/docs/build-budget.md`. The CI build-budget lint enforces
# parity between this manifest and that document.
[dependencies]
tokio = { version = "=1.40.0", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
axum = { version = "=0.7.7", default-features = false, features = ["http1", "json", "tokio", "matched-path", "tracing", "query", "multipart"] }
tower = { version = "=0.5.1", default-features = false, features = ["util"] }
tower-http = { version = "=0.6.1", default-features = false, features = ["trace"] }
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
anyhow = "=1.0.89"
thiserror = "=1.0.64"
dotenvy = "=0.15.7"
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", default-features = false, features = ["fmt", "json", "env-filter", "tracing-log"] }
sqlx = { version = "=0.7.4", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "macros"] }
chrono = { version = "=0.4.38", features = ["serde"] }
uuid = { version = "=1.10.0", features = ["v4", "serde"] }
arc-swap = "=1.7.1"
reqwest = { version = "=0.12.7", default-features = false, features = ["rustls-tls", "stream", "json"] }
jsonwebtoken = "=9.3.0"
bcrypt = "=0.15.1"
argon2 = { version = "=0.5.3", features = ["std"] }
validator = { version = "=0.18.1", features = ["derive"] }
sha2 = "=0.10.8"
toml = "=0.5.11"

[dev-dependencies]
tokio = { version = "=1.40.0", features = ["macros", "rt", "rt-multi-thread", "test-util"] }
tower = { version = "=0.5.1", default-features = false, features = ["util"] }
tempfile = "=3.13.0"

# Release profile tuned for a low-memory build host (see
# `docs/build-budget.md`). `codegen-units = 1` and `lto = "thin"` trade
# build time for lower peak RSS and a smaller binary. `strip = true`
# removes debug symbols from the final artifact.
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

# Dev profile keeps debug info minimal so `cargo check` / `cargo test`
# stay within the build-host memory budget.
[profile.dev]
debug = 1
