# ==============================================================================
# LƯU NIÊN — The Living Heritage Platform (RBPC 2026)
# Staging Reverse Proxy Configuration: luunien.histolab.icu
# Target Host: VPS IP 36.50.27.240 (BNIX Dedicated Cloud VPS)
# Architecture: Cloudflare (Full Strict) -> Nginx -> Rust Gateway (8001) / Next.js (3000)
# ==============================================================================
#
# CRITICAL WEBRTC UDP MEDIA WARNING:
# Cloudflare CDN (Orange Cloud) proxies only HTTP/HTTPS and TCP/WebSocket connections.
# Cloudflare DROPS arbitrary UDP packets on proxied domains!
#
# Media Plane vs Signaling Plane Separation:
# 1. SIGNALING (WebSocket / TCP):
#    - Handled via Nginx over HTTPS/WSS:
#      * LiveKit Signaling: wss://luunien.histolab.icu/livekit/ -> proxy to livekit:7880
#      * Janus Signaling:   wss://luunien.histolab.icu/janus     -> proxy to janus-gateway:8188
#    - Protected by Cloudflare CDN, DDoS mitigation, and SSL termination.
#
# 2. MEDIA PLANE (UDP / RTP / RTCP):
#    - MUST BYPASS CLOUDFLARE CDN PROXY.
#    - Packets must route directly to VPS Public IP 36.50.27.240:
#      * LiveKit RTC Media:   50000-50100/udp (bound directly on host 36.50.27.240)
#      * LiveKit TURN Relay:  51000-51100/udp, 51000-51100/tcp, 3478/tcp, 5349/tcp
#      * Janus RTC Media:     20000-20100/udp (bound directly on host 36.50.27.240)
#    - Cloudflare DNS Setup: Configure `rtc-staging.histolab.icu` as "DNS Only" (Grey Cloud)
#      pointing to 36.50.27.240 to advertise STUN/TURN ICE candidates directly.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Cloudflare Real IP Restoration
# Restore the actual client IP from CF-Connecting-IP header for logging & rate limits
# Official Cloudflare IP Ranges (IPv4 & IPv6): https://www.cloudflare.com/ips/
# ------------------------------------------------------------------------------
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;

# ------------------------------------------------------------------------------
# 1.1 Log Sanitization & GDPR-Compliant IP Masking (Zero-PII Invariant)
# Anonymizes visitor IPs and strips sensitive query parameters (tokens/contact info)
# ------------------------------------------------------------------------------
map $remote_addr $anonymized_remote_addr {
  ~(?P<ip>\d+\.\d+\.\d+)\.\d+    $ip.0;
  ~(?P<ip>[^:]+:[^:]+:[^:]+):    $ip::;
  default                        0.0.0.0;
}

# Strip sensitive query tokens from access logs (token, secret, contact values)
map $query_string $sanitized_query_string {
  default $query_string;
  ~*(.*)(?:token|secret|opaque_token|contact_value|email|phone)=[^&]+(.*) $1[REDACTED]$2;
}

# Sanitized Log Format: excludes request bodies, masks IP, redacts sensitive query parameters
log_format sanitized_combined '$anonymized_remote_addr - $remote_user [$time_local] '
                              '"$request_method $uri?$sanitized_query_string $server_protocol" '
                              '$status $body_bytes_sent "$http_referer" '
                              '"$http_user_agent" rt=$request_time';

# ------------------------------------------------------------------------------
# 1.2 Rate Limiting Zones (RBPC 2026 Phase 5 Invariant)
# ------------------------------------------------------------------------------
# Ingress rate limits per Phase 5 performance and resilience specification:
# - rbpc_inquiry: 5 requests/min per client IP for booking inquiry submissions
# - rbpc_ai: 20 requests/min per client IP for AI Cultural Bridge questions
limit_req_zone $binary_remote_addr zone=rbpc_inquiry:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=rbpc_ai:10m rate=20r/m;
limit_req_status 429;

# ------------------------------------------------------------------------------
# 2. HTTP Server — Redirect all HTTP to HTTPS & ACME Webroot
# ------------------------------------------------------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name luunien.histolab.icu;

  # ACME challenge endpoint (for Certbot webroot fallback)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    allow all;
  }

  # Redirect all other HTTP traffic to HTTPS with 301 Permanent Redirect
  location / {
    return 301 https://$host$request_uri;
  }
}

# ------------------------------------------------------------------------------
# 3. HTTPS Server — Staging Edge Proxy
# ------------------------------------------------------------------------------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name luunien.histolab.icu;

  # Internal Docker DNS resolver. Using variables for upstreams avoids startup crash
  # if upstream containers are restarting or dynamically assigned IP addresses.
  resolver 127.0.0.11 ipv6=off valid=30s;
  set $api_upstream http://api_rust:8001;
  set $web_upstream http://web:3000;
  set $livekit_upstream http://livekit:7880;
  set $janus_upstream http://janus-gateway:8188;

  # ----------------------------------------------------------------------------
  # TLS / SSL Configuration (Cloudflare Full Strict Mode)
  # ----------------------------------------------------------------------------
  # Cloudflare Origin CA certificate (valid for 15 years, trusted by Cloudflare edge)
  ssl_certificate     /etc/ssl/certs/cloudflare-origin-luunien.pem;
  ssl_certificate_key /etc/ssl/private/cloudflare-origin-luunien.key;

  # Fallback Certbot paths if Let's Encrypt is utilized instead:
  # ssl_certificate     /etc/letsencrypt/live/luunien.histolab.icu/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/luunien.histolab.icu/privkey.pem;

  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

  # ----------------------------------------------------------------------------
  # Security Headers
  # ----------------------------------------------------------------------------
  # HSTS (Strict-Transport-Security): 2 years with subdomains and preload list inclusion
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # Clickjacking defense: Allow same origin; external embedding restricted by frame-ancestors
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Prevent MIME-type sniffing
  add_header X-Content-Type-Options "nosniff" always;

  # Referrer policy: Strict origin when cross-origin to protect token leakage
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Permissions-Policy: Camera & Microphone permitted for same-origin WebRTC / AI voice tutor
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

  # Content-Security-Policy (CSP):
  # - Allows sketchfab.com and *.sketchfab.com in frame-src for 3D model embeds
  # - Allows store.histolab.icu for 3D models and assets
  # - Allows theclaracare.com router and WebSocket connections in connect-src
  # - Allows OpenStreetMap tile servers for interactive heritage maps
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://sketchfab.com https://*.sketchfab.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://store.histolab.icu https://*.sketchfab.com https://images.unsplash.com https://*.wikimedia.org https://tile.openstreetmap.org https://*.tile.openstreetmap.org; frame-src 'self' https://sketchfab.com https://*.sketchfab.com; connect-src 'self' wss://luunien.histolab.icu https://store.histolab.icu https://router.theclaracare.com https://*.sketchfab.com wss: https:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'self';" always;

  # ----------------------------------------------------------------------------
  # Performance, Buffers & Compression (Gzip / Brotli)
  # ----------------------------------------------------------------------------
  client_max_body_size 50m;

  # LiveKit v1 WebSocket join_request query params can be large (~8-16KB)
  client_header_buffer_size 16k;
  large_client_header_buffers 8 64k;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Long response timeouts for AI Tutor reasoning streams & heavy data aggregation
  proxy_connect_timeout 10s;
  proxy_send_timeout 180s;
  proxy_read_timeout 180s;

  # Gzip compression rules (Nginx origin)
  # - Compresses text/html (default), application/json, and image/svg+xml assets.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    image/svg+xml;
  gzip_disable "msie6";

  # Brotli compression rules (Cloudflare Edge & ngx_brotli module)
  # Cloudflare CDN (Full Strict proxy) automatically applies Brotli (br) compression
  # at the edge for text/html, application/json, and image/svg+xml assets.
  # For origin Nginx deployments with the ngx_brotli module loaded:
  # brotli on;
  # brotli_comp_level 6;
  # brotli_min_length 1024;
  # brotli_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/xml+rss image/svg+xml;

  # ----------------------------------------------------------------------------
  # Rate Limiting Error Envelope & Controlled API Endpoints
  # ----------------------------------------------------------------------------
  error_page 429 = @rate_limited;
  location @rate_limited {
    default_type application/json;
    add_header Retry-After 60 always;
    return 429 '{"error":{"code":"RATE_LIMIT_EXCEEDED","message":"Rate limit exceeded. Please wait and retry.","details":{"retry_after_seconds":60}}}';
  }

  # Inquiry submission endpoint: 5 req/min per IP with burst=5
  location = /api/v1/rbpc/inquiries {
    limit_req zone=rbpc_inquiry burst=5 nodelay;
    proxy_pass $api_upstream;
  }

  # AI Cultural Bridge & History Tutor question endpoints: 20 req/min per IP with burst=10
  location ~* ^/api/v1/(rbpc/cultural-bridge|history/tutor/ask|ai-tutor) {
    limit_req zone=rbpc_ai burst=10 nodelay;
    proxy_pass $api_upstream;
  }

  # ----------------------------------------------------------------------------
  # Backend API Routes (Routed through Rust Gateway at api_rust:8001)
  # ----------------------------------------------------------------------------

  # Backward compatibility: handle accidental double /api/ prefix from mobile clients
  location ^~ /api/api/ {
    rewrite ^/api/api/(.*)$ /api/$1 break;
    proxy_pass $api_upstream;
  }

  # ----------------------------------------------------------------------------
  # Public Heritage & Catalogue API Reads (Edge Caching Guidelines)
  # ----------------------------------------------------------------------------
  # Caching Guidelines:
  # - Cloudflare CDN edge cache: s-maxage=300 (5 minutes)
  # - Browser client cache: max-age=60 (1 minute)
  # - Stale-while-revalidate: 600s (allows background refresh during traffic spikes)
  # - Cache bypass: Mutating endpoints (POST/PUT/PATCH/DELETE), AI reasoning streams,
  #   and authenticated student progress strictly bypass this and use dynamic proxying.
  location ~* ^/api/v1/(heritage/(places|search)|history/(urns|reliefs|entities|stories|collections|sources)|rbpc/(stories|creators|experiences|impact|config)|urns|motifs) {
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
      add_header 'Access-Control-Max-Age' 86400;
      add_header 'Content-Length' 0;
      add_header 'Content-Type' 'text/plain charset=UTF-8';
      return 204;
    }
    proxy_pass $api_upstream;
    add_header Cache-Control "public, max-age=60, s-maxage=300, stale-while-revalidate=600" always;
    add_header Vary "Accept-Encoding, Accept, Origin" always;
  }

  # Primary API entrypoint -> Rust Gateway (:8001)
  # Rust gateway natively handles ~168 routes, and proxies fallback routes to Python (:8000)
  location /api/ {
    proxy_pass $api_upstream;
  }

  # Edge health check endpoint (pinged by uptime monitors & CI/CD deployment gates)
  location = /health {
    proxy_pass $api_upstream;
  }

  # Prometheus metrics endpoint (exposed by Rust Gateway on /metrics)
  location = /metrics {
    proxy_pass $api_upstream;
  }

  # Legacy backend root routes exposed outside /api
  location ^~ /motifs/ {
    proxy_pass $api_upstream;
    add_header Cache-Control "public, max-age=60, s-maxage=300, stale-while-revalidate=600" always;
  }

  location ^~ /progress/ {
    proxy_pass $api_upstream;
  }

  # ----------------------------------------------------------------------------
  # WebRTC Signaling Proxies (WebSocket upgrade)
  # ----------------------------------------------------------------------------

  # LiveKit WebSocket signaling endpoint: /livekit
  location = /livekit {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass $livekit_upstream/;
  }

  # LiveKit WebSocket signaling endpoint: /livekit/*
  # Browser connects to wss://luunien.histolab.icu/livekit/ -> Nginx strips prefix to /
  location ^~ /livekit/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass $livekit_upstream/;
  }

  # Janus WebRTC signaling endpoint: /janus
  # Browser connects to wss://luunien.histolab.icu/janus -> proxy to janus-gateway:8188
  location ^~ /janus {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass $janus_upstream;
  }

  # ----------------------------------------------------------------------------
  # Same-Origin Asset Proxying & Static Files
  # ----------------------------------------------------------------------------

  # Backward compatibility: clients prepending /api to asset paths
  location ^~ /api/assets/models/ {
    rewrite ^/api/assets/models/(.*)$ /assets/models/$1 break;
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Range' always;
      add_header 'Access-Control-Max-Age' 86400;
      add_header 'Content-Length' 0;
      add_header 'Content-Type' 'text/plain charset=UTF-8';
      return 204;
    }

    proxy_ssl_server_name on;
    proxy_ssl_name store.histolab.icu;
    proxy_set_header Host store.histolab.icu;
    proxy_buffering off;
    proxy_pass https://store.histolab.icu/;

    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, s-maxage=2592000, immutable" always;
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Range' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
  }

  location ^~ /api/assets/ {
    rewrite ^/api/assets/(.*)$ /assets/$1 break;
    root /var/www;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, s-maxage=2592000, immutable" always;
  }

  # 3D models hosted on store.histolab.icu (no CORS headers on source).
  # Proxied as same-origin assets with explicit CORS for mobile/web Three.js viewers.
  location ^~ /assets/models/ {
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Range' always;
      add_header 'Access-Control-Max-Age' 86400;
      add_header 'Content-Length' 0;
      add_header 'Content-Type' 'text/plain charset=UTF-8';
      return 204;
    }

    proxy_ssl_server_name on;
    proxy_ssl_name store.histolab.icu;
    proxy_set_header Host store.histolab.icu;
    proxy_buffering off;
    proxy_pass https://store.histolab.icu/;

    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, s-maxage=2592000, immutable" always;
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Range' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
  }

  # Local static assets (motif images, manifests, banners).
  # Mounted from ./ban-duc-noi to /var/www/assets/ban-duc-noi in docker-compose.
  location ^~ /assets/ {
    root /var/www;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, s-maxage=2592000, immutable" always;
  }

  # ----------------------------------------------------------------------------
  # Frontend Application (Next.js 15 on web:3000)
  # ----------------------------------------------------------------------------

  # Next.js immutable static build assets (fingerprinted js/css/chunks)
  location ^~ /_next/static/ {
    proxy_pass $web_upstream;
    access_log off;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable" always;
  }

  # Next.js optimized images
  location ^~ /_next/image {
    proxy_pass $web_upstream;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, s-maxage=604800, stale-while-revalidate=86400" always;
  }

  # SEO & Site Discovery Metadata (24h cache with 1h revalidate)
  location ~* ^/(robots\.txt|sitemap\.xml|manifest\.json|site\.webmanifest)$ {
    proxy_pass $web_upstream;
    expires 1d;
    add_header Cache-Control "public, max-age=86400, s-maxage=86400, stale-while-revalidate=3600" always;
  }

  # Static Web Icons & Fonts
  location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
    proxy_pass $web_upstream;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, s-maxage=2592000, immutable" always;
  }

  # Frontend SSR & Client Navigation
  location / {
    # Block arbitrary unsafe HTTP methods on frontend shell
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
      return 405;
    }
    proxy_pass $web_upstream;
  }
}
