                    - generic [ref=e135]: 20:57:36
                  - generic [ref=e136]: "**Cửu Đỉnh - Biểu tượng quyền lực và văn hóa triều Nguyễn (1802-1945):** 1. **Biểu tượng vương triều**: - 9 đỉnh tượng trưng cho 9 đời vua Nguyễn, khẳng định sự trường tồn và tính chính thống của triều đại. 2. **Bản đồ thu nhỏ**: - Hoa văn chạm khắc sông núi (Hồng Hà, Cửu Long), địa danh và sản vật đặc trưng thể hiện chủ quyền lãnh thổ thống nhất. 3. **Tinh hoa nghệ thuật**: - Đỉnh cao kỹ thuật đúc đồng Việt thế kỷ XIX, kết hợp họa tiết tứ linh (long-ly-quy-phượng) và cảnh sinh hoạt dân gian. *Ví dụ:* **Cao Đỉnh** (đỉnh trung tâm) khắc hình sông Hương - biểu tượng cho kinh đô Huế. **Checkpoint nhanh:** - Theo bạn, tại sao Cửu Đỉnh được xem là \"bảo vật quốc gia\" ngày nay? - Nếu được chọn 1 hình ảnh đại diện từ Cửu Đỉnh, bạn sẽ chọn gì? Nguồn tham khảo: [R1], [R2] Nguon tham khao: [S1] [S2]"
                - listitem [ref=e137]:
