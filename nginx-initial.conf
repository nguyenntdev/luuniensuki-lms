upstream api_upstream {
  server api:8000;
  keepalive 32;
}

upstream web_upstream {
  server web:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name lms.histolab.icu learn.histolab.icu;

  # ACME challenge (Certbot webroot mode)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  client_max_body_size 10m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Avoid 504s on long-running upstream responses.
  proxy_connect_timeout 10s;
  proxy_send_timeout 180s;
  proxy_read_timeout 180s;

  # Backend routes
  location ^~ /api/ {
    proxy_pass http://api_upstream;
  }

  # 3D models proxy from store.histolab.icu
  location ^~ /assets/models/ {
    proxy_ssl_server_name on;
    proxy_ssl_name store.histolab.icu;
    proxy_set_header Host store.histolab.icu;
    proxy_buffering off;
    proxy_pass https://store.histolab.icu/;
    access_log off;
    expires 7d;
  }

  location ^~ /assets/ {
    root /var/www;
    access_log off;
    expires 7d;
  }

  location ^~ /motifs/ {
    proxy_pass http://api_upstream;
  }

  location ^~ /progress/ {
    proxy_pass http://api_upstream;
  }

  # Frontend (Next.js)
  location / {
    proxy_pass http://web_upstream;
  }
}
