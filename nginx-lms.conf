server {
  listen 80;
  server_name lms.histolab.icu;

  # ACME challenge (Certbot webroot mode)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name lms.histolab.icu;
  resolver 127.0.0.11 ipv6=off valid=30s;
  set $api_upstream http://api_rust:8001;
  set $web_upstream http://web:3000;

  # Certbot-managed cert paths (stub; created after first issuance)
  ssl_certificate     /etc/letsencrypt/live/lms.histolab.icu/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/lms.histolab.icu/privkey.pem;

  # Reasonable TLS defaults (you can replace with certbot's generated includes)
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # Security headers
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  client_max_body_size 50m;
  # LiveKit v1 websocket may include a long join_request query param.
  # Increase request/header buffers to avoid 414 Request-URI Too Large.
  client_header_buffer_size 16k;
  large_client_header_buffers 8 64k;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Avoid 504s on long-running upstream responses.
  proxy_connect_timeout 10s;
  proxy_send_timeout 180s;
  proxy_read_timeout 180s;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml;
  gzip_disable "msie6";

  # Backend routes
  # Backward-compat: handle accidental double /api prefix from mobile clients.
  location ^~ /api/api/ {
    rewrite ^/api/api/(.*)$ /api/$1 break;
    proxy_pass $api_upstream;
  }

  location ^~ /api/ {
    proxy_pass $api_upstream;
  }

  # Health check endpoint
  location = /health {
    proxy_pass $api_upstream;
  }

  # LiveKit public endpoint via path prefix.
  # Handle "/livekit" (without trailing slash) directly to avoid redirecting
  # to an upstream internal host like 127.0.0.1.
  location = /livekit {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://livekit:7880/;
  }

  # Browser connects to wss://<domain>/livekit/ and Nginx strips this prefix.
  location ^~ /livekit/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://livekit:7880/;
  }

  # Janus WebRTC signaling: browser connects to wss://<domain>/janus (the Janus
  # WS API on :8188, internal-only). Exposes only the reverse-proxied WS path.
  location ^~ /janus {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://janus-gateway:8188;
  }

  # 3D models are hosted on store.histolab.icu (no CORS headers), so proxy them as same-origin assets.
  # Added CORS headers for mobile app 3D model loading
  location ^~ /assets/models/ {
    # Handle CORS preflight requests
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Range' always;
      add_header 'Access-Control-Max-Age' 86400;
      add_header 'Content-Length' 0;
      add_header 'Content-Type' 'text/plain charset=UTF-8';
      return 204;
    }

    proxy_ssl_server_name on;
    proxy_ssl_name store.histolab.icu;
    proxy_set_header Host store.histolab.icu;
    proxy_buffering off;
    proxy_pass https://store.histolab.icu/;

    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Range' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
  }

  # Static assets (images/models). Served directly by Nginx.
  location ^~ /assets/ {
    root /var/www;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # Current backend also exposes these at root (not under /api)
  location ^~ /motifs/ {
    proxy_pass $api_upstream;
  }

  location ^~ /progress/ {
    proxy_pass $api_upstream;
  }

  # Frontend (Next.js)
  location / {
    # We don't use Next.js Server Actions; reject non-GET to reduce noise/attack surface.
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
      return 405;
    }
    proxy_pass $web_upstream;
  }
}
