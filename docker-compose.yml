services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-luuniensuki}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-luuniensuki}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERACTION_TOLERANCE_MULTIPLIER: ${INTERACTION_TOLERANCE_MULTIPLIER:-1.25}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-insecure-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.yescale.vip/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v3}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-20}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_TOKEN_TTL_MINUTES: ${LIVEKIT_TOKEN_TTL_MINUTES:-120}
      LIVEKIT_ROOM_PREFIX: ${LIVEKIT_ROOM_PREFIX:-lms-live}
      DEMO_LIVE_ENTRY_ENABLED: ${DEMO_LIVE_ENTRY_ENABLED:-false}
      DEMO_LIVE_ENTRY_KEY: ${DEMO_LIVE_ENTRY_KEY:-}
      DEMO_LIVE_TEACHER_EMAIL: ${DEMO_LIVE_TEACHER_EMAIL:-}
      DEMO_LIVE_TEACHER_PASSWORD: ${DEMO_LIVE_TEACHER_PASSWORD:-}
      DEMO_LIVE_TEACHER_NAME: ${DEMO_LIVE_TEACHER_NAME:-Live Demo Teacher}
      DEMO_LIVE_CLASS_NAME: ${DEMO_LIVE_CLASS_NAME:-AI Teacher 3D Demo Class}
      DEMO_LIVE_SESSION_TITLE: ${DEMO_LIVE_SESSION_TITLE:-AI Teacher 3D Live Session}
      DEMO_LIVE_MAX_STUDENTS: ${DEMO_LIVE_MAX_STUDENTS:-60}
      DEMO_LIVE_BASE_URL: ${DEMO_LIVE_BASE_URL:-https://lms.histolab.icu}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    command:
      [
        "uvicorn",
        "backend.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--proxy-headers",
      ]
    volumes:
      - .:/app
      - uploads:/app/uploads
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  ai_teacher_agent:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-luuniensuki}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.yescale.vip/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v3}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-20}
      DEEPSEEK_MAX_RETRIES: ${DEEPSEEK_MAX_RETRIES:-1}
      LIVEKIT_ROOM_PREFIX: ${LIVEKIT_ROOM_PREFIX:-lms-live}
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        "python",
        "services/ai_teacher_agent/realtime_worker.py",
        "--interval",
        "${AI_TEACHER_WORKER_INTERVAL_SECONDS:-1.0}",
        "--max-sessions",
        "${AI_TEACHER_WORKER_MAX_SESSIONS:-200}",
        "--log-level",
        "${AI_TEACHER_WORKER_LOG_LEVEL:-INFO}",
      ]
    volumes:
      - .:/app
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.8.3
    command:
      - --bind
      - 0.0.0.0
      - --node-ip
      - ${LIVEKIT_NODE_IP:-127.0.0.1}
      - --keys
      - "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"
      - --port
      - "7880"
      - --rtc.tcp_port
      - "7881"
      - --rtc.port_range_start
      - "50000"
      - --rtc.port_range_end
      - "50100"
      - --turn.enabled
      - --turn.domain
      - ${LIVEKIT_TURN_DOMAIN:-lms.histolab.icu}
      - --turn.udp_port
      - "443"
      - --turn.tls_port
      - "5349"
      - --turn.cert_file
      - /etc/letsencrypt/live/lms.histolab.icu/fullchain.pem
      - --turn.key_file
      - /etc/letsencrypt/live/lms.histolab.icu/privkey.pem
      - --turn.relay_range_start
      - "51000"
      - --turn.relay_range_end
      - "51100"
    ports:
      - "7881:7881/tcp"
      - "443:443/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "50000-50100:50000-50100/udp"
      - "51000-51100:51000-51100/udp"
      - "51000-51100:51000-51100/tcp"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    profiles:
      - with-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - ./ban-duc-noi:/var/www/assets/ban-duc-noi:ro
      - uploads:/var/www/assets/avatars:ro
    depends_on:
      - api
      - web
      - livekit
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
