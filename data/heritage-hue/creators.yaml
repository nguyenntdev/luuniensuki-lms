    display_consent_ref: "CONSENT-PL-002"
    consent_status: "consented"
    is_verified: true
    approved_bio_vi: "Thạc sĩ Đỗ Hữu Triết là người đã dành hơn hai thập kỷ nghiên cứu tài liệu Hán-Nôm, mẫu vật khảo cổ và công nghệ vật liệu silicat để giải mã thành công bí quyết chế tác Pháp lam hoàng cung triều Nguyễn (họa pháp lam trên cốt đồng). Nhóm nghiên cứu của ông đã tham gia trực tiếp vào công tác bảo tồn, phục chế các chi tiết pháp lam trên bờ nóc điện Thái Hòa, điện Kiến Trung và lăng vua Khải Định, đưa nghệ thuật men màu cung đình trở lại đời sống nghệ thuật đương đại."
    approved_bio_en: "Master of Science and Artisan Đỗ Hữu Triết dedicated over two decades to decoding Hán-Nôm manuscripts, archaeological fragments, and silicate materials science to successfully resurrect the lost imperial art of Huế Pháp Lam (vitreous enamel on copper substrate). His research atelier has directly contributed to the historic restoration of architectural enamel ornaments atop Thái Hòa Palace, Kiến Trung Palace, and Khải Định Tomb, reintroducing vibrant royal enamel craft to contemporary culture."
    portrait_asset_url: "/assets/creators/do-huu-triet.webp"
    associated_places:
      - "dien-thai-hoa"
      - "dien-kien-trung"
      - "lang-khai-dinh"

  - id: "c1010001-0003-4000-8000-000000000003"
