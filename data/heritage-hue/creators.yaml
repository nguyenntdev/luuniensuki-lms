    craft_tradition: "Nghề làm hoa giấy truyền thống Thanh Tiên"
    craft_category: "paper_craft"
    public_region: "Xã Phú Mậu, Thành phố Huế"
    workshop_address_approx: "Làng Thanh Tiên, Xã Phú Mậu, TP. Huế"
    years_of_practice: 40
    generation_lineage: "Gia tộc nghệ nhân gìn giữ bí quyết nhuộm màu tự nhiên và phục hồi hoa sen giấy Thanh Tiên"
    display_consent_ref: "CONSENT-TT-003"
    consent_status: "consented"
    is_verified: true
    approved_bio_vi: "Nghệ nhân Ưu tú Thân Văn Huy là linh hồn của phong trào chấn hưng làng nghề hoa giấy Thanh Tiên ven sông Hương. Xuất phát từ nghề làm hoa giấy thờ cúng truyền thống có lịch sử hơn 300 năm, ông đã dày công phục dựng nghệ thuật làm hoa sen giấy tinh xảo, sử dụng tre cật vót mỏng, giấy thủ công và các sắc tố chiết xuất từ thảo mộc thiên nhiên (như hoa hòe, cây dành dành, vỏ cây vang). Tác phẩm hoa sen giấy Thanh Tiên của ông đã được trưng bày tại nhiều festival quốc tế và đại diện cho vẻ đẹp thanh tao của văn hóa Huế."
    approved_bio_en: "Meritorious Artisan Thân Văn Huy is the driving force behind the cultural revival of Thanh Tiên Paper Flower Village along the lower Perfume River. Rooted in a 300-year-old ritual folk tradition of paper floral offerings, he painstakingly reconstructed the refined art of the handmade paper lotus. Utilizing hand-planed bamboo ribs, local artisanal paper, and botanical dye pigments (sappanwood, gardenia, pagoda tree pods), his paper lotuses have been exhibited at international cultural festivals as an emblem of Huế's spiritual serenity."
    portrait_asset_url: "/assets/creators/than-van-huy.webp"
    associated_places:
      - "dien-hon-chen"
      - "chua-thien-mu"
      - "kinh-thanh-hue"
