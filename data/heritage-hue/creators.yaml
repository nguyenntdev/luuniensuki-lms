    approved_bio_vi: "Nghệ nhân Nhân dân Nguyễn Văn Sinh sinh ra trong một gia đình có truyền thống đúc đồng lâu đời tại làng đúc đồng Phường Đúc bên bờ sông Hương. Với hơn nửa thế kỷ gắn bó với nghề nung đồng và nặn khuôn đất sét pha trấu, ông đã phục chế và đúc nhiều đại hồng chung, đỉnh đồng và pháp khí cho các danh lam cổ tự trên khắp đất nước. Ông gìn giữ phương pháp đúc khuôn sáp và kỹ thuật pha chế hợp kim đồng truyền thống được truyền thừa qua nhiều thế hệ."
    approved_bio_en: "People's Artisan Nguyễn Văn Sinh was born into a long-standing bronze-casting family in the Phường Đúc foundry quarter along the Perfume River. With over half a century devoted to furnace firing and traditional clay-and-chaff molding, he has cast and restored numerous monumental temple bells, bronze cauldrons, and sacred ceremonial vessels nationwide. He actively preserves the lost-wax technique and ancient alloy formulations handed down through eleven generations."
