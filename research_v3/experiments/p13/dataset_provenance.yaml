integrity_checks:
  - archive sha256 verified by runner E00 stage
  - license text sha256 verified by runner E00 stage
  - studentVle has 0 null dates / 0 null clicks (verified at load; fail-closed)
  - all id_site values join to vle.csv (verified at load; fail-closed)
  - all studentVle (module, presentation, student) keys join to studentInfo (verified)
construct_capability_note:
  "OULAD records VLE page-level clicks per day. It contains NO psychological
  SRL instrument (no MSLQ/OSLQ, no diaries, no reflection logs) and forum
  clicks are page loads, not posts. Therefore P13-T03's target schema treats
  final_result as the only supervised target, and every SRL feature is a
  behavioural proxy with construct_validity: proxy_only."
