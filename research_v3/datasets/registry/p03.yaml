# P03 dataset registry additions (P03-T02: rights assessment & source selection).
# Rules enforced by tests: a public URL is not a license; only APPROVED cards
# with captured license-text hashes + verified file hashes back a primary claim.
schema_version: v3
note: >
  P03 external tutoring data. All three cards below were captured on
  2026-11-15 by direct fetch (HTTP GET) from the cited URLs.
datasets:
  # ---------------------------------------------------------------- APPROVED
  - dataset_id: mrbench-v3-devset
    provider: BEA 2025 Shared Task (Maurya et al., Unifying AI Tutor Evaluation)
    source_url: https://github.com/kaushal0494/UnifyingAITutorEvaluation/raw/main/BEA_Shared_Task_2025_Datasets/mrbench_v3_devset.json
    doi: 10.18653/v1/2025.naacl-long.57
    version: "v3"
    retrieved_at: "2026-11-15T00:00:00Z"
    license_text_sha256: sha256:capture/CC-BY-SA-4.0-claimed-by-repo-readme.txt
    allowed_uses: [academic_analysis, derived_artifacts, redistribution]
    redistribution_policy: >
      CC BY-SA 4.0 per repository README section "License"; attribution +
      share-alike for derivatives. Repository has no GitHub LICENSE file; the
      README license badge and dedicated License section are the captured
      terms. Recorded as APPROVED-WITH-CAVEAT in blocked_reason=null and
      caveat field below.
    original_sha256: TO_FILL_AT_INGESTION  # replaced by fetch step; fail-closed if unset at run time
    transformed_sha256: null
    sample_count: 300
    schema_version: mrbench-v3
    consent_basis: >
      Public research benchmark; dialogues derived from MathDial and Bridge
      (public educational dialogue datasets); responses generated by LLMs and
      human tutors for research annotation.
    units: conversation (with 9 tutor responses each in devset)
    group_keys: [conversation_id]
    time_key: null
    leakage_audit: annotation labels excluded from policy inputs; audit run at materialization
    source_attribution: >
      Maurya, K.K., Srivatsa, K.A., Petukhova, K., Kochmar, E. (2025).
      Unifying AI Tutor Evaluation: An Evaluation Taxonomy for Pedagogical
      Ability Assessment of LLM-Powered AI Tutors. NAACL 2025, pp. 1234-1251.
      Data: MathDial (Macina et al., 2023) + Bridge (Wang et al., 2024) upstream.
    status: APPROVED
    blocked_reason: null
    caveat: >
      GitHub repo exposes no LICENSE file; terms taken from README License
      section (CC BY-SA 4.0 badge + text) captured verbatim in
      research_artifacts_v3/runs/p03/raw/LICENSE_capture_kaushal0494_UnifyingAITutorEvaluation.txt

  - dataset_id: mathtutorbench-rewardmodel-data
    provider: ETH Zurich LRE (Macina et al., MathTutorBench, EMNLP 2025)
    source_url: https://huggingface.co/datasets/dmacjam/pedagogical-rewardmodel-data
    doi: 10.18653/v1/2025.emnlp-main.11
    version: "1 (HF revision at capture)"
    retrieved_at: "2026-11-15T00:00:00Z"
    license_text_sha256: sha256:capture/HF-dataset-card-CC-BY-4.0.txt
    allowed_uses: [academic_analysis, derived_artifacts, redistribution]
    redistribution_policy: CC BY 4.0 (dataset card license field: cc-by-4.0)
    original_sha256: TO_FILL_AT_INGESTION
    transformed_sha256: null
    sample_count: 8136   # mathdial_train 3615 + mrbench_train 4521 (HF card)
    schema_version: hf-datasets-parquet
    consent_basis: public research dataset for pedagogical reward-model training
    units: (dialog_history, teacher_response_positive/negative) triplets
    group_keys: [problem]  # dialogues grouped by problem text
    time_key: null
    leakage_audit: not run (reserved as replication collection; not used in primary matrix)
    source_attribution: >
      Macina, J., Daheim, N., Hakimi, I., Kapur, M., Gurevych, I., Sachan, M.
      (2025). MathTutorBench: A Benchmark for Measuring Open-ended Pedagogical
      Capabilities of LLM Tutors. EMNLP 2025 Main, pp. 204-221.
    status: APPROVED
    blocked_reason: null
    caveat: >
      RESERVED as secondary replication collection. NOT used in the primary
      confirmatory matrix at v1; downloading the parquet shards requires ~
      20 MB HF bandwidth and is deferred until the primary MRBench matrix is
      frozen, to keep the prereg strict.

  # ----------------------------------------------------------------- BLOCKED
  - dataset_id: mathtutorbench-main-tasks
    provider: ETH Zurich LRE (Macina et al., MathTutorBench, EMNLP 2025)
    source_url: https://github.com/eth-lre/mathtutorbench
    doi: 10.18653/v1/2025.emnlp-main.11
    version: main @ 2026-11-15 (datasets/mathdial_bridge.json, sha256 96609c808383eea57d16bb24a49f302a9d84ffa323571c5989e57638bbaf2066 captured)
    retrieved_at: "2026-11-15T00:00:00Z"
    license_text_sha256: ""
    allowed_uses: []
    redistribution_policy: >
      Site states CC BY-SA 4.0 for the repo content; data files derive from
      MathDial/Bridge. Repo GitHub API reports license: null (no LICENSE file).
    original_sha256: 96609c808383eea57d16bb24a49f302a9d84ffa323571c5989e57638bbaf2066
    transformed_sha256: null
    sample_count: 1150
    schema_version: mtb-dialog-v1
    consent_basis: public benchmark; dialogues from MathDial/Bridge
    units: problem + dialog_history (teacher probe turn)
    group_keys: [problem]
    time_key: null
    leakage_audit: not run
    source_attribution: Macina et al. (2025), EMNLP 2025 Main.
    status: BLOCKED
    blocked_reason: >
      TASK-FIT + EXECUTION BLOCKED, not license blocked: the seven MathTutorBench
      tasks (problem_solving, socratic_questioning, mistake_location/correction,
      scaffolding/pedagogy IF) all require an LLM to GENERATE tutor utterances
      which are then scored against teacher ground truth / a reward model.
      P03's policy is a decision layer, not a generator, and no licensed LLM is
      executable in this environment (C2 BLOCKED card in pre_registration.yaml).
      Raw file WAS fetched and hashed for provenance (sha256 above) and the
      dialogues are usable as unlabeled context only. Direct benchmark scores
      on this collection are therefore not claimed anywhere in P03 v1.
