services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERACTION_TOLERANCE_MULTIPLIER: ${INTERACTION_TOLERANCE_MULTIPLIER:-1.25}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.yescale.vip/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v3}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-20}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_TOKEN_TTL_MINUTES: ${LIVEKIT_TOKEN_TTL_MINUTES:-120}
      LIVEKIT_ROOM_PREFIX: ${LIVEKIT_ROOM_PREFIX:-lms-live}
      DEMO_LIVE_ENTRY_ENABLED: ${DEMO_LIVE_ENTRY_ENABLED:-false}
      DEMO_LIVE_ENTRY_KEY: ${DEMO_LIVE_ENTRY_KEY:-}
      DEMO_LIVE_TEACHER_EMAIL: ${DEMO_LIVE_TEACHER_EMAIL:-}
      DEMO_LIVE_TEACHER_PASSWORD: ${DEMO_LIVE_TEACHER_PASSWORD:-}
      DEMO_LIVE_TEACHER_NAME: ${DEMO_LIVE_TEACHER_NAME:-Live Demo Teacher}
      DEMO_LIVE_CLASS_NAME: ${DEMO_LIVE_CLASS_NAME:-AI Teacher 3D Demo Class}
      DEMO_LIVE_SESSION_TITLE: ${DEMO_LIVE_SESSION_TITLE:-AI Teacher 3D Live Session}
      DEMO_LIVE_MAX_STUDENTS: ${DEMO_LIVE_MAX_STUDENTS:-60}
      DEMO_LIVE_BASE_URL: ${DEMO_LIVE_BASE_URL:-https://lms.histolab.icu}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.yescale.vip/v1/embeddings}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-20}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ban-duc-noi:/app/ban-duc-noi:ro
    command: >
      /bin/sh -c
      "gunicorn -k uvicorn.workers.UvicornWorker
      -w ${GUNICORN_WORKERS:-2}
      -b 0.0.0.0:8000
      --timeout ${GUNICORN_TIMEOUT:-180}
      backend.main:app"

  api_rust:
    build:
      context: ./backend-rust
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8001
      RUST_LOG: ${RUST_LOG:-info}
      LEGACY_API_HOST: api
      LEGACY_API_PORT: 8000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      # Live-room (Janus) — media plane selected by LIVE_MEDIA_BACKEND.
      LIVE_MEDIA_BACKEND: ${LIVE_MEDIA_BACKEND:-livekit}
      JANUS_WS_URL: ${JANUS_WS_URL:-ws://janus-gateway:8188}
      JANUS_HTTP_URL: ${JANUS_HTTP_URL:-http://janus-gateway:8088/janus}
      JANUS_ADMIN_URL: ${JANUS_ADMIN_URL:-http://janus-gateway:7088/admin}
      JANUS_PUBLIC_WS_URL: ${JANUS_PUBLIC_WS_URL:-wss://lms.histolab.icu/janus}
      JANUS_ADMIN_SECRET: ${JANUS_ADMIN_SECRET:-}
      JANUS_API_SECRET: ${JANUS_API_SECRET:-}
      LIVE_INTERNAL_TOKEN: ${LIVE_INTERNAL_TOKEN:-}
      LIVE_JOIN_CREDENTIAL_TTL_MINUTES: ${LIVE_JOIN_CREDENTIAL_TTL_MINUTES:-30}
      LIVE_RECONNECT_GRACE_SECONDS: ${LIVE_RECONNECT_GRACE_SECONDS:-20}
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Prefer same-origin API in production. Leave NEXT_PUBLIC_API_BASE_URL unset
      # so the frontend can call "/api/..." through Nginx.
    depends_on:
      - api_rust

  ai_teacher_agent:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.yescale.vip/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v3}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-20}
      DEEPSEEK_MAX_RETRIES: ${DEEPSEEK_MAX_RETRIES:-1}
      LIVEKIT_ROOM_PREFIX: ${LIVEKIT_ROOM_PREFIX:-lms-live}
    depends_on:
      db:
        condition: service_healthy
    command: >
      python services/ai_teacher_agent/realtime_worker.py
      --interval ${AI_TEACHER_WORKER_INTERVAL_SECONDS:-1.0}
      --max-sessions ${AI_TEACHER_WORKER_MAX_SESSIONS:-200}
      --log-level ${AI_TEACHER_WORKER_LOG_LEVEL:-INFO}

  livekit:
    image: livekit/livekit-server:v1.8.3
    restart: unless-stopped
    command:
      - --bind
      - 0.0.0.0
      - --node-ip
      - ${LIVEKIT_NODE_IP:-127.0.0.1}
      - --keys
      - "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"
      - --port
      - "7880"
      - --rtc.tcp_port
      - "7881"
      - --rtc.port_range_start
      - "50000"
      - --rtc.port_range_end
      - "50100"
      - --turn.enabled
      - --turn.domain
      - ${LIVEKIT_TURN_DOMAIN:-lms.histolab.icu}
      - --turn.udp_port
      - "443"
      - --turn.tls_port
      - "5349"
      - --turn.cert_file
      - /etc/letsencrypt/live/lms.histolab.icu/fullchain.pem
      - --turn.key_file
      - /etc/letsencrypt/live/lms.histolab.icu/privkey.pem
      - --turn.relay_range_start
      - "51000"
      - --turn.relay_range_end
      - "51100"
    ports:
      - "7881:7881/tcp"
      - "443:443/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "50000-50100:50000-50100/udp"
      - "51000-51100:51000-51100/udp"
      - "51000-51100:51000-51100/tcp"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro

  janus-gateway:
    image: mwalbeck/janus-gateway:1.4.1
    restart: unless-stopped
    # Janus .jcfg files do not expand env vars, so substitute the secrets into a
    # writable copy of the mounted config templates at start, then launch janus.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /tmp/janus-etc
        cp /opt/janus/etc/janus-tmpl/*.jcfg /tmp/janus-etc/
        sed -i "s|REPLACE_JANUS_ADMIN_SECRET|$$JANUS_ADMIN_SECRET|g; s|REPLACE_JANUS_API_SECRET|$$JANUS_API_SECRET|g" /tmp/janus-etc/*.jcfg
        exec /opt/janus/bin/janus -F /tmp/janus-etc
    environment:
      JANUS_ADMIN_SECRET: ${JANUS_ADMIN_SECRET:?set in prod}
      JANUS_API_SECRET: ${JANUS_API_SECRET:?set in prod}
    expose:
      - "8188"
      - "8088"
      - "7088"
    ports:
      - "20000-20100:20000-20100/udp"
    volumes:
      - ./janus/etc:/opt/janus/etc/janus-tmpl:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "8088:80"
      - "8443:443"
    volumes:
      - ./nginx-lms.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./ban-duc-noi:/var/www/assets/ban-duc-noi:ro
    depends_on:
      - web
      - api
      - api_rust
      - ai_teacher_agent
      - livekit
      - janus-gateway

volumes:
  postgres_data:
